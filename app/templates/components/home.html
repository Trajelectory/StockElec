{% extends "base.html" %}
{% block title %}{{ app_name or 'StockEleK' }}{% endblock %}

{% block content %}
<div class="home-wrap">

  <div class="home-hero">
    <div class="home-logo-block">
      <img class="home-logo"
           src="{{ url_for('static', filename='img/Logo.png') }}"
           alt="StockEleK" id="home-logo-el"/>
    </div>

    <h1 class="home-title">{{ app_name or 'StockEleK' }}</h1>
    <p class="home-sub">{{ t.home.tagline }}</p>

    <form method="get" action="{{ url_for('components.stock') }}"
          id="home-search-form" autocomplete="off">
      <div class="home-search">
        <input type="text" name="search" id="home-search-input"
               class="home-search-input" autofocus
               placeholder="{{ t.home.search_placeholder }}"/>
        <div class="home-search-spinner" id="home-search-spinner"></div>
      </div>
      <div id="home-search-dd" class="home-dd"></div>
    </form>
  </div>

</div>

<script>
(function() {
  // ── Swap logo thème clair/sombre ────────────────────────────
  const logo = document.getElementById('home-logo-el');
  if (logo) {
    const dark  = logo.src;
    const light = dark.replace('Logo.png', 'Logo_c.png');
    const applyTheme = () => {
      logo.src = document.documentElement.dataset.theme === 'light' ? light : dark;
    };
    applyTheme();
    new MutationObserver(applyTheme).observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
  }

  // ── Recherche avec autocomplete ──────────────────────────────
  const inp = document.getElementById('home-search-input');
  const dd  = document.getElementById('home-search-dd');
  const sp  = document.getElementById('home-search-spinner');
  if (!inp || !dd) return;

  let _timer = null, _items = [], _idx = -1;

  const closeDD = () => { dd.style.display = 'none'; _items = []; _idx = -1; };
  window.closeHomeDropdown = closeDD;

  inp.addEventListener('input', () => {
    clearTimeout(_timer);
    const q = inp.value.trim();
    if (q.length < 2) { closeDD(); return; }
    if (sp) sp.classList.add('active');
    _timer = setTimeout(() => doSearch(q), 200);
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(_idx + 1, _items.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); setActive(Math.max(_idx - 1, 0)); }
    if (e.key === 'Escape')    { closeDD(); inp.blur(); }
    if (e.key === 'Enter' && _idx >= 0 && _items[_idx]) {
      e.preventDefault(); closeDD(); window.location.href = _items[_idx];
    }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#home-search-form')) closeDD();
  });

  function doSearch(q) {
    fetch('/api/search?q=' + encodeURIComponent(q))
      .then(r => r.json())
      .then(data => { if (sp) sp.classList.remove('active'); renderDD(data, q); })
      .catch(()  => { if (sp) sp.classList.remove('active'); });
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function renderDD(data, q) {
    dd.innerHTML = ''; _items = []; _idx = -1;
    const comps = data.components || [], projs = data.projects || [];

    if (!comps.length && !projs.length) {
      dd.innerHTML = `<div class="home-dd-empty">{{ t.home.no_result }}</div>`;
      dd.style.display = 'block'; return;
    }

    const section = (icon, label) => {
      const d = document.createElement('div');
      d.className = 'home-dd-section';
      d.innerHTML = `<span>${icon}</span><span>${label}</span>`;
      return d;
    };

    const C_STATUS = {
      idea:'#06b6d4', design:'var(--accent)', ordered:'#f97316',
      production:'#a855f7', assembly:'var(--warning)', debug:'var(--danger)',
      done:'var(--success)', archived:'var(--text-muted)'
    };

    const row = (url, thumb, name, sub, right) => {
      const idx = _items.length; _items.push(url);
      const a = document.createElement('a');
      a.href = url; a.className = 'home-dd-row'; a.dataset.idx = idx;
      a.addEventListener('click', closeDD);
      a.addEventListener('mouseenter', () => setActive(idx));
      a.innerHTML = `
        <div class="home-dd-thumb">${thumb}</div>
        <div class="home-dd-info">
          <div class="home-dd-name">${name}</div>
          ${sub ? `<div class="home-dd-sub">${sub}</div>` : ''}
        </div>
        ${right ? `<div class="home-dd-right">${right}</div>` : ''}`;
      return a;
    };

    if (comps.length) {
      dd.appendChild(section('⚡', `{{ t.home.section_comps }} (${comps.length})`));
      comps.forEach(c => {
        const thumb = c.image_path
          ? `<img src="/images/${c.image_path.replace(/.*images\//, '')}" />`
          : `<span>📦</span>`;
        const qc = c.quantity === 0 ? 'var(--danger)' : c.quantity < 5 ? 'var(--warning)' : 'var(--success)';
        dd.appendChild(row(
          `/component/${c.id}`, thumb,
          esc(c.description || c.ref || '—'),
          (c.ref ? `<span style="color:var(--accent)">${esc(c.ref)}</span>` : '') + (c.package ? ` · ${esc(c.package)}` : ''),
          `<span style="font-family:var(--mono);font-weight:700;color:${qc}">${c.quantity}</span>`
        ));
      });
    }

    if (projs.length) {
      dd.appendChild(section('🗂', '{{ t.home.section_proj }}'));
      projs.forEach(p => {
        const sc = C_STATUS[p.status] || 'var(--text-muted)';
        dd.appendChild(row(
          `/projects/${p.id}`, `<span>🗂️</span>`,
          esc(p.name),
          `<span style="color:${sc};font-family:var(--mono)">${esc(p.status)}</span>`,
          null
        ));
      });
    }

    const footer = document.createElement('div');
    footer.className = 'home-dd-footer';
    footer.innerHTML = `<a href="/stock?search=${encodeURIComponent(q)}" onclick="closeHomeDropdown()">
      → {{ t.home.see_all_stock }}</a>`;
    dd.appendChild(footer);
    dd.style.display = 'block';
  }

  function setActive(idx) {
    _idx = idx;
    dd.querySelectorAll('.home-dd-row').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
    });
  }
})();
</script>
{% endblock %}
